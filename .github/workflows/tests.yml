name: tests-and-artifacts
on:
  push:
    branches: [main, "boy-scout/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Create audit evidence manifest
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          manifest = {
              "commit": commit,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "os": platform.platform(),
              "python": sys.version,
              "implementation": platform.python_implementation(),
          }
          Path("artifacts/manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          python -m pip freeze > artifacts/pip-freeze.txt
      - name: Run tests and write JUnit report
        run: python -m pytest -q --junitxml=artifacts/junit.xml
      - name: Upload reproducible audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boy-scout-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
